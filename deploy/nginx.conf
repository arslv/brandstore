# Brand Store: nginx принимает запросы и передаёт сайту на порт 3000.
# server_name и HTTPS дописывает npm run deploy -- --domain … (через certbot).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;   # загрузка фото (до 8 МБ)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # цена по ссылке может искаться до ~20 с
    }
}
